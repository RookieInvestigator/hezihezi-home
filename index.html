:root{
  --bg:#ffffff;
  --ink:#1b1b1b;
  --r:18px;
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #ffb27a;outline-offset:3px;border-radius:6px}

.wrap{max-width:760px;margin:0 auto;padding:clamp(36px,8vh,80px) 20px clamp(30px,6vh,60px)}

.logo{

}

/* ── 四张图 ───────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:clamp(38px,8vh,72px)}
.card{
  display:block;border-radius:var(--r);overflow:hidden;
  transition:translate .18s ease;
  animation:pop .5s cubic-bezier(.2,.7,.3,1) both;
}
.card:hover,.card:focus-visible{translate:0 -4px}
.art{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}

.card:nth-child(1){animation-delay:.02s}
.card:nth-child(2){animation-delay:.09s}
.card:nth-child(3){animation-delay:.16s}
.card:nth-child(4){animation-delay:.23s}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:520px){
  .grid{grid-template-columns:1fr;gap:14px}
}
@media (prefers-reduced-motion:reduce){
  .card{animation:none;transition:none}
}
</style>
